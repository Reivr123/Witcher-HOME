<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap');

:root{
  --bg-void:#120e09;
  --bg-void-2:#1d160f;
  --parchment:#e9dcbb;
  --parchment-2:#ddcda3;
  --parchment-3:#f1e6c9;
  --ink:#3a2c1c;
  --ink-soft:#6e5a3e;
  --gold:#c9a227;
  --gold-bright:#e6c25c;
  --side:#4f6e4a;
  --treasure:#a5651f;
  --contract:#7d2b26;
  --idea:#4a6670;
  --line:#4a3c26;
  --line-light:#9a875f;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse 900px 500px at 50% -10%, #2a2015 0%, var(--bg-void) 55%),
    var(--bg-void);
  color:var(--parchment);
  font-family:'EB Garamond', Georgia, serif;
  min-height:100vh;
  padding:calc(28px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(70px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  -webkit-font-smoothing:antialiased;
}
.app{max-width:880px;margin:0 auto;}

/* ---------- header / ledger ---------- */
.ledger{
  display:flex;
  gap:22px;
  align-items:center;
  background:linear-gradient(180deg, var(--bg-void-2), #171009);
  border:1px solid var(--line);
  border-radius:10px;
  padding:20px;
  box-shadow: 0 0 0 1px rgba(201,162,39,0.06), 0 18px 40px -20px rgba(0,0,0,0.7);
  margin-bottom:18px;
  flex-wrap:wrap;
}
.medallion-wrap{flex-shrink:0;filter:drop-shadow(0 0 10px rgba(201,162,39,0.25));}
.medallion{width:104px;height:104px;transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:#332818;stroke-width:6;}
.ring-fg{fill:none;stroke:var(--gold-bright);stroke-width:6;stroke-linecap:round;
  stroke-dasharray:326.7; stroke-dashoffset:326.7; transition:stroke-dashoffset 0.8s cubic-bezier(.4,1.4,.4,1);}
.ring-inner{fill:#1a130b;stroke:var(--line-light);stroke-width:1;}
.medallion-text{transform:rotate(90deg);transform-origin:60px 60px;}
.lvl-num{font-family:'Cinzel',serif;font-size:30px;fill:var(--parchment-3);text-anchor:middle;}
.lvl-label{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:2px;fill:var(--line-light);text-anchor:middle;}

.ledger-info{flex:1;min-width:220px;}
.ledger-info h1{
  font-family:'Cinzel',serif;font-weight:700;font-size:22px;letter-spacing:1px;
  margin:0 0 12px 0;color:var(--parchment-3);
  text-shadow:0 0 18px rgba(201,162,39,0.18);
}
.xp-row{display:flex;justify-content:space-between;align-items:baseline;
  font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--line-light);margin-bottom:4px;}
.xp-bar{height:8px;background:#2a2114;border-radius:5px;overflow:hidden;border:1px solid var(--line);}
.xp-fill{height:100%;background:linear-gradient(90deg,#8a6c1e,var(--gold-bright));width:0%;transition:width .6s ease;}
.mini-stats{display:flex;gap:18px;margin-top:12px;flex-wrap:wrap;
  font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--parchment-2);}
.mini-stats b{color:var(--gold-bright);font-weight:600;}

/* ---------- quick add ---------- */
.quick-add{
  background:var(--bg-void-2);border:1px solid var(--line);border-radius:10px;
  padding:14px;margin-bottom:16px;
}
.quick-add input[type=text], .quick-add textarea{
  width:100%;background:#100c07;border:1px solid var(--line);border-radius:6px;
  color:var(--parchment);font-family:'EB Garamond',serif;font-size:16px;padding:10px 12px;
  margin-bottom:8px;resize:vertical;
}
.quick-add textarea{min-height:44px;font-size:14px;}
.quick-add input:focus, .quick-add textarea:focus, .quick-add select:focus{
  outline:2px solid var(--gold); outline-offset:1px;
}
.quick-add-row{display:flex;gap:8px;flex-wrap:wrap;}
.quick-add select{
  background:#100c07;border:1px solid var(--line);color:var(--parchment-2);
  font-family:'JetBrains Mono',monospace;font-size:12px;padding:8px 10px;border-radius:6px;flex:1;min-width:130px;
}
.quick-add button{
  background:linear-gradient(180deg,var(--gold-bright),var(--gold));
  border:none;color:#241b0a;font-family:'Cinzel',serif;font-weight:600;font-size:13px;
  letter-spacing:0.5px;padding:9px 18px;border-radius:6px;cursor:pointer;
}
.quick-add button:hover{filter:brightness(1.08);}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.tab{
  background:transparent;border:1px solid var(--line);color:var(--line-light);
  font-family:'Cinzel',serif;font-size:11px;letter-spacing:0.5px;padding:7px 12px;
  border-radius:20px;cursor:pointer;transition:all .15s;
}
.tab:hover{border-color:var(--gold);color:var(--parchment);}
.tab.active{background:var(--gold);border-color:var(--gold);color:#241b0a;font-weight:600;}

/* ---------- board / cards ---------- */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
.quest-card{
  background:linear-gradient(180deg,var(--parchment-3),var(--parchment));
  color:var(--ink);border-radius:8px;padding:14px 14px 12px;position:relative;
  box-shadow:0 10px 24px -12px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(58,44,28,0.08);
  border-left:5px solid var(--seal-color, var(--gold));
  transition:transform .15s;
}
.quest-card.done{opacity:0.55;}
.quest-card.done .quest-title{text-decoration:line-through;}
.seal-tag{
  display:inline-flex;align-items:center;gap:5px;font-family:'JetBrains Mono',monospace;
  font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--seal-color,var(--gold));
  margin-bottom:6px;font-weight:600;
}
.quest-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.quest-title{font-family:'Cinzel',serif;font-size:15px;font-weight:600;margin:0;line-height:1.3;}
.quest-stars{font-size:11px;color:var(--seal-color,var(--gold));white-space:nowrap;letter-spacing:1px;}
.progress-bar{height:6px;background:rgba(58,44,28,0.15);border-radius:4px;overflow:hidden;margin:9px 0 6px;}
.progress-fill{height:100%;background:var(--seal-color,var(--gold));width:0%;transition:width .4s;}
.progress-label{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-soft);margin-bottom:6px;}
.subtasks{list-style:none;margin:0 0 8px;padding:0;}
.subtasks li{display:flex;align-items:flex-start;gap:6px;font-size:13px;padding:2px 0;cursor:pointer;}
.subtasks li input{margin-top:3px;accent-color:var(--seal-color,var(--gold));cursor:pointer;}
.subtasks li.checked span{text-decoration:line-through;color:var(--ink-soft);}
.add-subtask{display:flex;gap:5px;margin:4px 0 8px;}
.add-subtask input{
  flex:1;font-size:12px;padding:5px 7px;border:1px solid rgba(58,44,28,0.25);
  border-radius:4px;background:rgba(255,255,255,0.35);color:var(--ink);
}
.add-subtask button{
  border:none;background:rgba(58,44,28,0.12);color:var(--ink);border-radius:4px;
  padding:5px 9px;font-size:12px;cursor:pointer;
}
.quest-actions{display:flex;gap:8px;margin-top:8px;}
.quest-actions button{
  flex:1;border:none;border-radius:5px;padding:7px 8px;font-family:'Cinzel',serif;
  font-size:11px;letter-spacing:0.4px;cursor:pointer;font-weight:600;
}
.btn-complete{background:var(--seal-color,var(--gold));color:#221a0c;}
.btn-complete:hover{filter:brightness(1.1);}
.btn-delete{background:transparent;color:var(--ink-soft);border:1px solid rgba(58,44,28,0.25) !important;}
.btn-delete:hover{color:var(--contract);border-color:var(--contract) !important;}

.empty-state{
  grid-column:1/-1;text-align:center;padding:40px 20px;color:var(--line-light);
  font-family:'EB Garamond',serif;font-style:italic;font-size:15px;border:1px dashed var(--line);border-radius:10px;
}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
  background:linear-gradient(180deg,var(--parchment-3),var(--parchment));color:var(--ink);
  font-family:'Cinzel',serif;font-weight:600;font-size:13px;padding:12px 20px;border-radius:8px;
  box-shadow:0 12px 30px -10px rgba(0,0,0,0.6);opacity:0;pointer-events:none;transition:all .35s;z-index:50;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.footer-row{
  display:flex;justify-content:center;margin-top:26px;
}
.reset-link{
  background:none;border:none;color:var(--line-light);font-family:'JetBrains Mono',monospace;
  font-size:11px;cursor:pointer;text-decoration:underline;opacity:0.6;
}
.reset-link:hover{opacity:1;color:var(--contract);}

@media (max-width:480px){
  .ledger{padding:16px;gap:14px;}
  .medallion{width:84px;height:84px;}
  .ledger-info h1{font-size:18px;}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important;}
}
</style>
</head>
<body>
<div class="app">

  <header class="ledger">
    <div class="medallion-wrap">
      <svg class="medallion" viewBox="0 0 120 120">
        <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
        <circle class="ring-fg" id="ringFg" cx="60" cy="60" r="52"></circle>
        <circle class="ring-inner" cx="60" cy="60" r="42"></circle>
        <g class="medallion-text">
          <text x="60" y="66" class="lvl-num" id="lvlNum">1</text>
          <text x="60" y="80" class="lvl-label">РІВЕНЬ</text>
        </g>
      </svg>
    </div>
    <div class="ledger-info">
      <h1>Щоденник Мандрівника</h1>
      <div class="xp-row">
        <span>Досвід</span>
        <span id="xpLabel">0 / 100 XP</span>
      </div>
      <div class="xp-bar"><div class="xp-fill" id="xpFill"></div></div>
      <div class="mini-stats">
        <div>Активних: <b id="activeCount">0</b></div>
        <div>Завершено: <b id="doneCount">0</b></div>
        <div>Серія: <b id="streakCount">0</b> дн.</div>
      </div>
    </div>
  </header>

  <form class="quick-add" id="quickAddForm">
    <input type="text" id="questTitle" placeholder="Новий запис у журнал… напр. «Здати звіт до п'ятниці»" required maxlength="120">
    <textarea id="questSubtasks" placeholder="Кроки до виконання, кожен з нового рядка (необов'язково)"></textarea>
    <div class="quick-add-row">
      <select id="questCategory">
        <option value="main">⚔ Основна лінія</option>
        <option value="side">✦ Другорядний</option>
        <option value="treasure">◆ Скарб</option>
        <option value="contract">☠ Контракт (терміново)</option>
        <option value="idea">✎ Ідея / нотатка</option>
      </select>
      <select id="questDifficulty">
        <option value="easy">★ Просто · 15 XP</option>
        <option value="medium" selected>★★ Середньо · 30 XP</option>
        <option value="hard">★★★ Складно · 60 XP</option>
        <option value="epic">★★★★ Епічно · 100 XP</option>
      </select>
      <button type="submit">Занотувати</button>
    </div>
  </form>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-cat="all">Усе</button>
    <button class="tab" data-cat="main">Основна лінія</button>
    <button class="tab" data-cat="side">Другорядні</button>
    <button class="tab" data-cat="treasure">Скарби</button>
    <button class="tab" data-cat="contract">Контракти</button>
    <button class="tab" data-cat="idea">Ідеї</button>
  </nav>

  <main class="board" id="board">
    <div class="empty-state">Завантажую журнал…</div>
  </main>

  <div class="footer-row" style="gap:14px;flex-wrap:wrap;">
    <button class="reset-link" id="exportBtn">експортувати прогрес у файл</button>
    <button class="reset-link" id="resetBtn">скинути весь журнал</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){

const CATS = {
  main:     { label:'Основна лінія',  color:'#c9a227', glyph:'⚔' },
  side:     { label:'Другорядний',    color:'#6f9a63', glyph:'✦' },
  treasure: { label:'Скарб',          color:'#c98a3e', glyph:'◆' },
  contract: { label:'Контракт',       color:'#c25b53', glyph:'☠' },
  idea:     { label:'Ідея',           color:'#7fa3ad', glyph:'✎' },
};
const DIFF = {
  easy:   { xp:15,  stars:'★' },
  medium: { xp:30,  stars:'★★' },
  hard:   { xp:60,  stars:'★★★' },
  epic:   { xp:100, stars:'★★★★' },
};
const EMPTY_TEXT = {
  all:      'Журнал порожній. Впиши перший запис вище — навіть дрібницю.',
  main:     'Головна історія ще не почалась. З чого розпочнеться твоя сага?',
  side:     'Другорядних клопотів поки немає. Можна видихнути.',
  treasure: 'Скарбниця порожня. Час на полювання за дрібними перемогами.',
  contract: 'Жодних термінових контрактів. Спокійна ніч.',
  idea:     'Ідей ще не занотовано. Кидай сюди все, що спадає на думку.',
};

const QUESTS_KEY = 'wanderer-journal-quests';
const META_KEY = 'wanderer-journal-meta';

let quests = [];
let meta = { xp:0, streak:0, lastCompletionDate:null, totalCompleted:0 };
let activeTab = 'all';

const $ = (id) => document.getElementById(id);

function uid(){ return 'q' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function yesterdayStr(){ const d = new Date(); d.setDate(d.getDate()-1); return d.toISOString().slice(0,10); }

// Дані зберігаються локально на цьому пристрої (localStorage) —
// це самостійний застосунок, більше не потребує Claude.
async function loadData(){
  try{
    const q = localStorage.getItem(QUESTS_KEY);
    quests = q ? JSON.parse(q) : [];
  }catch(e){ quests = []; }
  try{
    const m = localStorage.getItem(META_KEY);
    meta = m ? JSON.parse(m) : meta;
  }catch(e){ /* keep defaults */ }
}

async function saveQuests(){
  try{ localStorage.setItem(QUESTS_KEY, JSON.stringify(quests)); }
  catch(e){ console.error('Не вдалося зберегти квести', e); }
}
async function saveMeta(){
  try{ localStorage.setItem(META_KEY, JSON.stringify(meta)); }
  catch(e){ console.error('Не вдалося зберегти прогрес', e); }
}

function questProgress(q){
  if(q.subtasks && q.subtasks.length){
    const done = q.subtasks.filter(s=>s.done).length;
    return Math.round((done / q.subtasks.length) * 100);
  }
  return q.completed ? 100 : 0;
}

function isFullyDone(q){
  if(q.subtasks && q.subtasks.length) return q.subtasks.every(s=>s.done);
  return !!q.completed;
}

function levelFromXp(xp){
  const level = Math.floor(xp/100) + 1;
  const inLevel = xp % 100;
  return { level, inLevel, next:100 };
}

function showToast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=>t.classList.remove('show'), 2200);
}

function renderStats(){
  const { level, inLevel } = levelFromXp(meta.xp);
  $('lvlNum').textContent = level;
  $('xpLabel').textContent = inLevel + ' / 100 XP';
  $('xpFill').style.width = inLevel + '%';

  const active = quests.filter(q=>!isFullyDone(q)).length;
  const done = quests.filter(q=>isFullyDone(q)).length;
  $('activeCount').textContent = active;
  $('doneCount').textContent = done;
  $('streakCount').textContent = meta.streak;

  const committed = quests.filter(q=>q.category!=='idea');
  const committedDone = committed.filter(isFullyDone).length;
  const pct = committed.length ? committedDone/committed.length : 0;
  const circumference = 2*Math.PI*52;
  $('ringFg').style.strokeDasharray = circumference;
  $('ringFg').style.strokeDashoffset = circumference * (1-pct);
}

function subtaskRow(q, s){
  return `<li class="${s.done?'checked':''}" data-sub="${s.id}">
    <input type="checkbox" ${s.done?'checked':''}>
    <span>${escapeHtml(s.text)}</span>
  </li>`;
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function renderBoard(){
  const board = $('board');
  const list = quests
    .filter(q => activeTab==='all' || q.category===activeTab)
    .sort((a,b)=>{
      const da = isFullyDone(a), db = isFullyDone(b);
      if(da!==db) return da?1:-1;
      return b.createdAt - a.createdAt;
    });

  if(!list.length){
    board.innerHTML = `<div class="empty-state">${EMPTY_TEXT[activeTab]}</div>`;
    return;
  }

  board.innerHTML = list.map(q=>{
    const cat = CATS[q.category] || CATS.idea;
    const diff = DIFF[q.difficulty] || DIFF.medium;
    const pct = questProgress(q);
    const done = isFullyDone(q);
    const subtasksHtml = (q.subtasks||[]).map(s=>subtaskRow(q,s)).join('');
    return `
    <div class="quest-card ${done?'done':''}" style="--seal-color:${cat.color}" data-id="${q.id}">
      <div class="seal-tag">${cat.glyph} ${cat.label}</div>
      <div class="quest-head">
        <h3 class="quest-title">${escapeHtml(q.title)}</h3>
        <div class="quest-stars">${diff.stars}</div>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-label">${pct}% виконано · ${diff.xp} XP</div>
      ${subtasksHtml ? `<ul class="subtasks">${subtasksHtml}</ul>` : ''}
      <div class="add-subtask">
        <input type="text" placeholder="+ додати крок" data-addsub="${q.id}">
        <button data-addsubbtn="${q.id}">Додати</button>
      </div>
      <div class="quest-actions">
        <button class="btn-complete" data-complete="${q.id}">${done ? 'Повернути в дію' : 'Завершити квест'}</button>
        <button class="btn-delete" data-delete="${q.id}">Видалити</button>
      </div>
    </div>`;
  }).join('');
}

async function render(){
  renderStats();
  renderBoard();
}

async function addXpAndStreak(xp){
  meta.xp += xp;
  meta.totalCompleted += 1;
  const today = todayStr();
  if(meta.lastCompletionDate !== today){
    meta.streak = (meta.lastCompletionDate === yesterdayStr()) ? meta.streak + 1 : 1;
    meta.lastCompletionDate = today;
  }
  await saveMeta();
}

async function completeQuest(id){
  const q = quests.find(x=>x.id===id);
  if(!q) return;
  const wasDone = isFullyDone(q);
  if(!wasDone){
    if(q.subtasks && q.subtasks.length){
      q.subtasks.forEach(s=>s.done=true);
    } else {
      q.completed = true;
    }
    const diff = DIFF[q.difficulty] || DIFF.medium;
    await addXpAndStreak(diff.xp);
    showToast(`Квест завершено · +${diff.xp} XP`);
  } else {
    if(q.subtasks && q.subtasks.length){
      q.subtasks.forEach(s=>s.done=false);
    } else {
      q.completed = false;
    }
  }
  await saveQuests();
  await render();
}

async function deleteQuest(id){
  quests = quests.filter(q=>q.id!==id);
  await saveQuests();
  await render();
}

async function toggleSubtask(qid, sid){
  const q = quests.find(x=>x.id===qid);
  if(!q) return;
  const s = q.subtasks.find(x=>x.id===sid);
  if(!s) return;
  const wasFullyDone = isFullyDone(q);
  s.done = !s.done;
  const nowFullyDone = isFullyDone(q);
  if(!wasFullyDone && nowFullyDone){
    const diff = DIFF[q.difficulty] || DIFF.medium;
    await addXpAndStreak(diff.xp);
    showToast(`Квест завершено · +${diff.xp} XP`);
  }
  await saveQuests();
  await render();
}

async function addSubtask(qid, text){
  const q = quests.find(x=>x.id===qid);
  if(!q || !text.trim()) return;
  q.subtasks = q.subtasks || [];
  q.subtasks.push({ id: uid(), text: text.trim(), done:false });
  q.completed = false;
  await saveQuests();
  await render();
}

async function addQuest(title, category, difficulty, subtaskLines){
  const subtasks = subtaskLines
    .split('\n')
    .map(s=>s.trim())
    .filter(Boolean)
    .map(text=>({ id: uid(), text, done:false }));
  quests.push({
    id: uid(),
    title: title.trim(),
    category,
    difficulty,
    subtasks,
    completed:false,
    createdAt: Date.now(),
  });
  await saveQuests();
  await render();
}

async function resetJournal(){
  if(!confirm('Стерти весь журнал і прогрес? Це незворотньо.')) return;
  quests = [];
  meta = { xp:0, streak:0, lastCompletionDate:null, totalCompleted:0 };
  await saveQuests();
  await saveMeta();
  await render();
}

// ---------- events ----------
$('quickAddForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const title = $('questTitle').value;
  if(!title.trim()) return;
  const category = $('questCategory').value;
  const difficulty = $('questDifficulty').value;
  const subtasks = $('questSubtasks').value;
  await addQuest(title, category, difficulty, subtasks);
  $('questTitle').value = '';
  $('questSubtasks').value = '';
  $('questTitle').focus();
});

$('tabs').addEventListener('click', (e)=>{
  const btn = e.target.closest('.tab');
  if(!btn) return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  activeTab = btn.dataset.cat;
  renderBoard();
});

$('board').addEventListener('click', async (e)=>{
  const completeId = e.target.closest('[data-complete]');
  const deleteId = e.target.closest('[data-delete]');
  const addSubBtn = e.target.closest('[data-addsubbtn]');
  const subLi = e.target.closest('[data-sub]');

  if(completeId) return completeQuest(completeId.dataset.complete);
  if(deleteId){
    if(confirm('Видалити цей запис назавжди?')) return deleteQuest(deleteId.dataset.delete);
    return;
  }
  if(addSubBtn){
    const qid = addSubBtn.dataset.addsubbtn;
    const input = document.querySelector(`[data-addsub="${qid}"]`);
    const val = input.value;
    input.value = '';
    return addSubtask(qid, val);
  }
  if(subLi && e.target.tagName !== 'INPUT'){
    const card = subLi.closest('[data-id]');
    return toggleSubtask(card.dataset.id, subLi.dataset.sub);
  }
});

$('board').addEventListener('change', (e)=>{
  if(e.target.matches('.subtasks input[type=checkbox]')){
    const li = e.target.closest('[data-sub]');
    const card = e.target.closest('[data-id]');
    toggleSubtask(card.dataset.id, li.dataset.sub);
  }
});

$('board').addEventListener('keydown', (e)=>{
  if(e.target.matches('[data-addsub]') && e.key==='Enter'){
    e.preventDefault();
    const qid = e.target.dataset.addsub;
    const val = e.target.value;
    e.target.value = '';
    addSubtask(qid, val);
  }
});

async function exportData(){
  const payload = { quests, meta, exportedAt: Date.now(), exportedFrom: 'wanderer-journal' };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'wanderer-export.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Файл готовий — збережи його у Файли');
}

$('exportBtn').addEventListener('click', exportData);
$('resetBtn').addEventListener('click', resetJournal);

// ---------- init ----------
(async function init(){
  await loadData();
  await render();
})();

})();
</script>
</body>
</html>
